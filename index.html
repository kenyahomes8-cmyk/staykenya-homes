<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pan-African Express Loans</title>
  <!-- Load Supabase Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    
    .loan-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; max-width: 520px; width: 100%; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .header { margin-bottom: 1.5rem; text-align: center; }
    .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .header p { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-main); }
    select, input { width: 100%; padding: 0.75rem 1rem; background-color: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    select:focus, input:focus { border-color: var(--primary); }

    .range-wrap { display: flex; flex-direction: column; gap: 0.5rem; }
    .amount-display { font-size: 1.75rem; font-weight: 800; color: #fff; text-align: center; padding: 0.5rem 0; }

    .btn-submit { width: 100%; padding: 0.875rem; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background-color 0.2s; }
    .btn-submit:hover { background-color: var(--primary-hover); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .alert { padding: 1rem; border-radius: 8px; margin-top: 1rem; display: none; font-size: 0.875rem; line-height: 1.4; }
    .alert-success { background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
    .alert-error { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }
  </style>
</head>
<body>

<div class="loan-card">
  <div class="header">
    <h1 id="ui-title">Instant Personal Loan</h1>
    <p id="ui-subtitle">Select your country to start your application</p>
  </div>

  <form id="loanForm">
    <div class="form-group">
      <label id="lbl-country" for="countrySelect">Select Target Country</label>
      <select id="countrySelect" required>
        <option value="" disabled selected>-- Choose Country --</option>
        <option value="KE">Kenya</option>
        <option value="TZ">Tanzania</option>
        <option value="UG">Uganda</option>
        <option value="ZM">Zambia</option>
        <option value="CD">DR Congo</option>
        <option value="BW">Botswana</option>
        <option value="ZA">South Africa</option>
        <option value="ZW">Zimbabwe</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lbl-name" for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Jane Doe" required />
    </div>

    <div class="form-group">
      <label id="lbl-phone" for="phone">Mobile Phone Number</label>
      <input type="tel" id="phone" placeholder="+254..." required />
    </div>

    <div class="form-group range-wrap">
      <label id="lbl-amount" for="loanAmount">Requested Loan Amount</label>
      <div class="amount-display" id="amountDisplay">0</div>
      <input type="range" id="loanAmount" min="100" max="1000000" step="50" value="1000" />
    </div>

    <button type="submit" class="btn-submit" id="btn-submit">Apply Immediately</button>
  </form>

  <div id="responseAlert" class="alert"></div>
</div>

<script>
  // -------------------------------------------------------------
  // PASTE YOUR SUPABASE KEYS FROM STEP 1 HERE:
  // -------------------------------------------------------------
  const SUPABASE_URL = 'https://qzkmwpqhdhowzqoudoex.supabase.co/rest/v1/';
  const SUPABASE_ANON_KEY = 'sb_publishable_SCGYtG3cJGOMj-J6tYvNxQ_yMTPEB42';
  
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Country dictionary setup (dynamic currency & dynamic languages)
  const countryConfig = {
    KE: {
      currency: "KES", symbol: "KSh", dialCode: "+254", min: 1000, max: 150000, step: 1000,
      lang: {
        title: "Mkopo wa Haraka", subtitle: "Omba mkopo wako kwa dakika chache tu",
        country: "Chagua Nchi", name: "Jina Kamili", phone: "Nambari ya Simu",
        amount: "Kiasi cha Mkopo", submit: "Tuma Maombi Sasa",
        success: "Imefanikiwa! Maombi yako ya mkopo yamepokelewa. Tutakupigia simu mara moja."
      }
    },
    TZ: {
      currency: "TZS", symbol: "TSh", dialCode: "+255", min: 20000, max: 3000000, step: 10000,
      lang: {
        title: "Mkopo wa Papo Kwa Papo", subtitle: "Pata mkopo kwa urahisi na haraka",
        country: "Chagua Nchi", name: "Jina Kamili", phone: "Nambari ya Simu",
        amount: "Kiasi cha Mkopo", submit: "Omba Mkopo Sasa",
        success: "Hongera! Ombi lako limepokelewa kikamilifu."
      }
    },
    UG: {
      currency: "UGX", symbol: "USh", dialCode: "+256", min: 50000, max: 5000000, step: 50000,
      lang: {
        title: "Instant Express Loan", subtitle: "Fast cash approvals directly to your mobile money",
        country: "Select Country", name: "Full Name", phone: "Phone Number",
        amount: "Loan Amount Needed", submit: "Apply Now",
        success: "Success! Your application has been logged and is under instant review."
      }
    },
    ZM: {
      currency: "ZMW", symbol: "ZK", dialCode: "+260", min: 100, max: 20000, step: 100,
      lang: {
        title: "Fast Mobile Loans", subtitle: "Quick cash solutions for everyday needs",
        country: "Select Country", name: "Full Name", phone: "Phone Number",
        amount: "Loan Amount", submit: "Submit Application",
        success: "Thank you! Your application was submitted successfully."
      }
    },
    CD: {
      currency: "CDF", symbol: "FC", dialCode: "+243", min: 10000, max: 1000000, step: 5000,
      lang: {
        title: "Prêt Rapide en Ligne", subtitle: "Obtenez un financement immédiat en quelques clics",
        country: "Sélectionnez le pays", name: "Nom Complet", phone: "Numéro de Téléphone",
        amount: "Montant du Prêt", submit: "Demander le Prêt",
        success: "Succès! Votre demande de prêt a été soumise avec succès."
      }
    },
    BW: {
      currency: "BWP", symbol: "P", dialCode: "+267", min: 200, max: 25000, step: 100,
      lang: {
        title: "Quick Pula Loans", subtitle: "Fast access to funds in Botswana",
        country: "Select Country", name: "Full Name", phone: "Phone Number",
        amount: "Loan Amount", submit: "Apply Now",
        success: "Application received! We will contact you shortly."
      }
    },
    ZA: {
      currency: "ZAR", symbol: "R", dialCode: "+27", min: 500, max: 50000, step: 500,
      lang: {
        title: "Instant Cash Loans", subtitle: "Flexible borrowing options tailor-made for you",
        country: "Select Country", name: "Full Name", phone: "Phone Number",
        amount: "Loan Amount", submit: "Complete Application",
        success: "Success! Your loan request has been routed for instant decisioning."
      }
    }
  };

  const countrySelect = document.getElementById("countrySelect");
  const amountInput = document.getElementById("loanAmount");
  const amountDisplay = document.getElementById("amountDisplay");
  const phoneInput = document.getElementById("phone");
  const loanForm = document.getElementById("loanForm");
  const submitBtn = document.getElementById("btn-submit");
  const responseAlert = document.getElementById("responseAlert");

  let activeSymbol = "$";

  // Country switch logic
  countrySelect.addEventListener("change", (e) => {
    const code = e.target.value;
    const config = countryConfig[code];
    if (!config) return;

    // Switch Language
    document.getElementById("ui-title").innerText = config.lang.title;
    document.getElementById("ui-subtitle").innerText = config.lang.subtitle;
    document.getElementById("lbl-country").innerText = config.lang.country;
    document.getElementById("lbl-name").innerText = config.lang.name;
    document.getElementById("lbl-phone").innerText = config.lang.phone;
    document.getElementById("lbl-amount").innerText = config.lang.amount;
    submitBtn.innerText = config.lang.submit;

    // Set Phone Code & Boundaries
    phoneInput.value = config.dialCode + " ";
    activeSymbol = config.symbol;
    
    amountInput.min = config.min;
    amountInput.max = config.max;
    amountInput.step = config.step;
    amountInput.value = config.min;

    updateAmountLabel(config.min, config.symbol);
  });

  // Dynamic Currency Input
  amountInput.addEventListener("input", (e) => {
    updateAmountLabel(e.target.value, activeSymbol);
  });

  function updateAmountLabel(val, symbol) {
    const formatted = new Intl.NumberFormat().format(val);
    amountDisplay.innerText = `${symbol} ${formatted}`;
  }

  // Handle Form Submission directly into Database
  loanForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const selectedCountry = countrySelect.value;
    if (!selectedCountry) return;

    const config = countryConfig[selectedCountry];
    submitBtn.disabled = true;
    responseAlert.style.display = "none";

    const payload = {
      country_code: selectedCountry,
      full_name: document.getElementById("fullName").value,
      phone_number: phoneInput.value.trim(),
      requested_amount: parseFloat(amountInput.value),
      currency_code: config.currency
    };

    const { data, error } = await _supabase
      .from('loan_applications')
      .insert([payload]);

    submitBtn.disabled = false;

    if (error) {
      responseAlert.className = "alert alert-error";
      responseAlert.innerText = "Error: " + error.message;
      responseAlert.style.display = "block";
    } else {
      responseAlert.className = "alert alert-success";
      responseAlert.innerText = config.lang.success;
      responseAlert.style.display = "block";
      loanForm.reset();
      amountDisplay.innerText = "0";
    }
  });
</script>
</body>
</html>
